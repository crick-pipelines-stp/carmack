[tox]
envlist = pip_install, build_and_install_wheel, build_and_install_sdist
isolated_build = true

[testenv:pip_install]
description = Install using pip and run tests
commands =
    pip install '.[tests]'
    pytest --cov=carmack --cov-fail-under=90 --cov-report=term-missing --cov-report=html
    asf-tools --version

