# The one workflow that publishes. It runs the suite first (tests.yml, called as-is) and
# pushes the runtime image to ghcr.io/crick-pipelines-stp/carmack only if that passes.
#
# Tags:
#   sha-<7>        every push to main and every release; never moved, so it is what a
#                  consumer pins, together with the digest in the run summary
#   main           the newest main build; moves on every push, never pin it
#   X.Y.Z, X.Y     a vX.Y.Z git tag
#   latest         the newest vX.Y.Z git tag that is not a pre-release
# `local` is never produced here: that name is left to consumers' own developer builds.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A half-finished push is never cancelled; a second one for the same ref waits instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    name: push the runtime image
    needs: test
    # A dispatch from any other branch would push an image nobody asked for.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags and the history back to them.
          fetch-depth: 0

      # The same derivation the Dockerfile documents for CARMACK_VERSION: vX.Y.Z itself
      # gives X.Y.Z and N commits past it gives X.Y.Z.N. Until the first v* tag exists it
      # falls back to 0.0.0+<sha>, which still ties every stats-file header to a commit.
      - name: Derive the package version
        id: version
        run: |
          version=$(git describe --tags --match 'v*' 2>/dev/null \
              | sed 's/^v//;s/-\([0-9]*\)-g.*/.\1/') || true
          echo "version=${version:-0.0.0+$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # provenance is off so the push is one plain manifest: a single digest to pin, and no
      # attestation entry in an index for older apptainer pulls to trip over.
      - name: Build and push the runtime target
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: CARMACK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Published \`${IMAGE}\`"
            echo
            echo "carmack version \`${VERSION}\`"
            echo
            echo '```'
            echo "${IMAGE}:sha-${GITHUB_SHA::7}@${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo "${TAGS}" | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
