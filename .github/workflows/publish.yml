# The one workflow that publishes. It starts when a tests.yml run finishes, and pushes the
# runtime image to ghcr.io/crick-pipelines-stp/carmack only if that run passed and was a
# push to main, a v* tag, or a dispatch from one of those refs. To rebuild an image,
# dispatch the "Docker tests" workflow on main or the tag, not this one.
#
# A workflow_run run executes in the context of the default branch, so github.ref and
# github.sha name the tip of main, not the commit that was tested. Everything below
# works from the tested run's head_sha and head_branch instead (head_branch holds the
# tag name for a tag push).
#
# Tags:
#   sha-<7>        every push to main and every release; never moved, so it is what a
#                  consumer pins, together with the digest in the run summary
#   main           the newest main build; moves on every push, never pin it
#   X.Y.Z, X.Y     a vX.Y.Z git tag
#   latest         the newest vX.Y.Z git tag that is not a pre-release
# `local` is never produced here: that name is left to consumers' own developer builds.
name: Publish image

on:
  workflow_run:
    workflows: ["Docker tests"]
    types: [completed]
    # Matched against the tested run's head_branch, which is the tag name for a tag push.
    # PR runs never start this workflow, so its runs, and its badge, are publishes only.
    branches: [main, "v*"]

# A half-finished push is never cancelled; a second one for the same ref waits instead.
concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  SOURCE_REF: ${{ github.event.workflow_run.head_branch }}

jobs:
  publish:
    name: push the runtime image
    # PR runs, fork runs and runs from any other branch never publish: an image from
    # them is one nobody asked for.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.head_branch == 'main'
          || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          # git describe needs the tags and the history back to them.
          fetch-depth: 0

      # The same derivation the Dockerfile documents for CARMACK_VERSION: vX.Y.Z itself
      # gives X.Y.Z and N commits past it gives X.Y.Z.N. Until the first v* tag exists it
      # falls back to 0.0.0+<sha>, which still ties every stats-file header to a commit.
      - name: Derive the package version
        id: version
        run: |
          version=$(git describe --tags --match 'v*' 2>/dev/null \
              | sed 's/^v//;s/-\([0-9]*\)-g.*/.\1/') || true
          short_sha=$(git rev-parse --short=7 HEAD)
          echo "version=${version:-0.0.0+${short_sha}}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag names its source explicitly: metadata-action's own sha, branch and
      # semver detection reads github.sha and github.ref, which here are main's tip.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
            type=raw,value=main,enable=${{ env.SOURCE_REF == 'main' }}
            type=semver,pattern={{version}},value=${{ env.SOURCE_REF }},enable=${{ startsWith(env.SOURCE_REF, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.SOURCE_REF }},enable=${{ startsWith(env.SOURCE_REF, 'v') }}
            type=raw,value=latest,enable=${{ startsWith(env.SOURCE_REF, 'v') && !contains(env.SOURCE_REF, '-') }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      # provenance is off so the push is one plain manifest: a single digest to pin, and no
      # attestation entry in an index for older apptainer pulls to trip over.
      - name: Build and push the runtime target
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: CARMACK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Published \`${IMAGE}\`"
            echo
            echo "carmack version \`${VERSION}\`"
            echo
            echo '```'
            echo "${IMAGE}:sha-${SHORT_SHA}@${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo "${TAGS}" | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
