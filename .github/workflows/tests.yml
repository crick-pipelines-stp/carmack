# Nothing is published. The image is built on the runner, loaded into that runner's
# daemon, run, and thrown away with it -- no registry, no login, no tags that outlive
# the job -- which is why `contents: read` is the whole permission set.
name: Docker tests

# A push to main or a v* tag is tested here too, and publish.yml starts from the run's
# completion rather than calling this workflow, so every run of the suite, PR or not, is
# recorded under this workflow and its badge.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Only a PR's superseded run is cancelled. Every other run gets a group of its own,
# because a cancelled -- or queued-and-replaced -- run on main or a tag never reaches
# publish.yml, and that commit would get no image.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-tests:
    name: pytest in the test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx, for the GitHub Actions cache exporter below; the stock docker
      # driver cannot write type=gha.
      - uses: docker/setup-buildx-action@v3

      - name: Build the test target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: carmack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the suite
        run: docker run --rm carmack:test
